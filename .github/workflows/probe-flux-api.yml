name: Probe official FLUX Space API

on:
  push:
    paths:
      - .github/workflows/probe-flux-api.yml

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the public Gradio API contract
        run: |
          python -m pip install --quiet --upgrade gradio_client
          python - <<'PY'
          from contextlib import redirect_stdout, redirect_stderr
          from pathlib import Path
          from io import StringIO
          import inspect
          import json
          import traceback
          from gradio_client import Client

          out = StringIO()
          record = {
              "space": "black-forest-labs/FLUX.1-schnell",
              "client_version": None,
              "view_api_signature": None,
              "api": None,
              "stdout": None,
              "error": None,
          }
          try:
              import gradio_client
              record["client_version"] = getattr(gradio_client, "__version__", "unknown")
              with redirect_stdout(out), redirect_stderr(out):
                  client = Client("black-forest-labs/FLUX.1-schnell", verbose=True)
                  record["view_api_signature"] = str(inspect.signature(client.view_api))
                  try:
                      record["api"] = client.view_api(all_endpoints=True, return_format="dict")
                  except TypeError:
                      record["api"] = client.view_api(all_endpoints=True)
          except Exception:
              record["error"] = traceback.format_exc()
          record["stdout"] = out.getvalue()
          Path('.github/flux-api-contract.json').write_text(
              json.dumps(record, indent=2, default=str), encoding='utf-8'
          )
          PY

      - name: Commit the contract and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/flux-api-contract.json
          git rm .github/workflows/probe-flux-api.yml
          git commit -m "chore: record official FLUX Space API contract"
          git push
