name: Generate Agentic Coding hero artwork

on:
  push:
    paths:
      - .github/workflows/capture-agentic-hero.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify the raster artwork
        run: |
          python -m pip install --quiet --upgrade gradio_client pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter
          from gradio_client import Client
          import json
          import shutil

          prompt = (
              "Wide 16:9 text-free premium editorial digital illustration for Agentic Coding, "
              "an abstract dark navy architectural terrain made of layered branching software pathways, "
              "viewed obliquely from above, one precise cyan navigation route crossing the structure, "
              "stopping at one small sharply localized vermilion fault zone, then continuing through "
              "several pale blue evidence checkpoints toward a stable clear route, forensic and calm, "
              "controlled atmospheric depth, crisp geometry, generous quiet negative space on the left "
              "for headline typography, sophisticated systems art, no people, no faces, no logos, no words, "
              "no letters, no code text, no terminal screens, no dashboards, no hacker imagery, "
              "no circuit-board cliche, no flat vector icon scene"
          )

          client = Client("black-forest-labs/FLUX.1-schnell", verbose=True)
          result = client.predict(
              prompt,
              548127,
              False,
              1536,
              864,
              4,
              api_name="/infer",
          )
          print("FLUX result:", result)
          candidate = result[0] if isinstance(result, (tuple, list)) else result
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("url") or candidate.get("name")
          if not isinstance(candidate, str):
              raise SystemExit(f"Unsupported image result: {type(candidate)!r} {candidate!r}")

          working = Path("/tmp/agentic-source")
          if candidate.startswith(("http://", "https://")):
              request = Request(candidate, headers={"User-Agent": "Mozilla/5.0"})
              working.write_bytes(urlopen(request, timeout=120).read())
          else:
              source = Path(candidate)
              if not source.exists():
                  raise SystemExit(f"Returned image path does not exist: {candidate}")
              shutil.copyfile(source, working)

          image = Image.open(working).convert("RGB")
          print(f"Generated source: {image.width}x{image.height} {image.format}")
          image = ImageOps.fit(image, (1600, 900), method=Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          output = Path("docs/assets/agentic-coding-hero.png")
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format="PNG", optimize=True)

          check = Image.open(output)
          if check.format != "PNG" or check.size != (1600, 900):
              raise SystemExit(f"Raster verification failed: {check.format} {check.size}")
          if output.stat().st_size < 100_000:
              raise SystemExit(f"Generated asset is suspiciously small: {output.stat().st_size} bytes")
          print(f"Verified {output}: PNG {check.width}x{check.height}, {output.stat().st_size} bytes")
          PY

      - name: Commit the asset and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/agentic-coding-hero.png
          git rm .github/workflows/capture-agentic-hero.yml
          git commit -m "Add generated Agentic Coding hero artwork"
          git push
