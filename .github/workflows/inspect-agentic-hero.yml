name: Make temporary Agentic Coding artwork preview

on:
  push:
    paths:
      - .github/workflows/inspect-agentic-hero.yml

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create compact inspection copy
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open('docs/assets/agentic-coding-hero.png').convert('RGB')
          source.resize((256, 144), Image.Resampling.LANCZOS).save(
              'docs/assets/agentic-coding-inspection.jpg',
              format='JPEG', quality=34, optimize=True, progressive=False
          )
          PY
      - name: Commit preview and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/agentic-coding-inspection.jpg
          git rm .github/workflows/inspect-agentic-hero.yml
          git commit -m "chore: add temporary Agentic Coding artwork preview"
          git push
